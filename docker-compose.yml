x-app-environment: &app-environment
  NODE_ENV: production
  APP_URL: ${APP_URL:?APP_URL is required}
  NEXT_PUBLIC_APP_URL: ${APP_URL:?APP_URL is required}
  BETTER_AUTH_URL: ${APP_URL:?APP_URL is required}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
  AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:?AUTH_TRUSTED_ORIGINS is required}
  DATABASE_URL: postgres://${POSTGRES_USER:-openvac}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-openvac}
  MODEL_PROVIDER: ${MODEL_PROVIDER:-deepseek}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  DEEPSEEK_ALLOWED_HOSTS: ${DEEPSEEK_ALLOWED_HOSTS:-api.deepseek.com}
  DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
  DEEPSEEK_RESPONSES_MODEL: ${DEEPSEEK_RESPONSES_MODEL:-deepseek-v4-flash}
  DEEPSEEK_USER_PARTITION_SECRET: ${DEEPSEEK_USER_PARTITION_SECRET:-}
  DEEPSEEK_THINKING_MODE: ${DEEPSEEK_THINKING_MODE:-disabled}
  MODEL_MAX_OUTPUT_TOKENS: ${MODEL_MAX_OUTPUT_TOKENS:-4096}
  AGENT_AUTO_MAX_OUTPUT_TOKENS: ${AGENT_AUTO_MAX_OUTPUT_TOKENS:-4096}
  AGENT_DEEP_MAX_OUTPUT_TOKENS: ${AGENT_DEEP_MAX_OUTPUT_TOKENS:-8192}
  AGENT_AUTO_TIMEOUT_MS: ${AGENT_AUTO_TIMEOUT_MS:-120000}
  AGENT_DEEP_TIMEOUT_MS: ${AGENT_DEEP_TIMEOUT_MS:-180000}
  AGENT_QUERY_EMBEDDING_TIMEOUT_MS: ${AGENT_QUERY_EMBEDDING_TIMEOUT_MS:-8000}
  AGENT_STALE_RUN_MS: ${AGENT_STALE_RUN_MS:-210000}
  MODEL_INPUT_COST_MICROS_PER_MILLION_TOKENS: ${MODEL_INPUT_COST_MICROS_PER_MILLION_TOKENS:-}
  MODEL_OUTPUT_COST_MICROS_PER_MILLION_TOKENS: ${MODEL_OUTPUT_COST_MICROS_PER_MILLION_TOKENS:-}
  MODEL_PRICE_VERSION: ${MODEL_PRICE_VERSION:-}
  ANSWER_V3_EVAL_ADAPTER: ${ANSWER_V3_EVAL_ADAPTER:-src/evals/answer-v3/live-adapter.ts}
  ANSWER_V3_EVAL_GIT_SHA: ${ANSWER_V3_EVAL_GIT_SHA:-}
  ANSWER_V3_EVAL_IMAGE_DIGEST: ${ANSWER_V3_EVAL_IMAGE_DIGEST:-}
  ANSWER_V3_EVAL_BASE_URL: ${ANSWER_V3_EVAL_BASE_URL:-}
  ANSWER_V3_EVAL_OUTPUT_DIR: ${ANSWER_V3_EVAL_OUTPUT_DIR:-.artifacts/evals}
  ANSWER_V3_QWEN_JUDGE_MODEL: ${ANSWER_V3_QWEN_JUDGE_MODEL:-qwen-plus}
  ANSWER_V3_RUNTIME_EVIDENCE: ${ANSWER_V3_RUNTIME_EVIDENCE:-}
  ANSWER_V3_RUNTIME_EVIDENCE_SHA256: ${ANSWER_V3_RUNTIME_EVIDENCE_SHA256:-}
  DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
  DASHSCOPE_WORKSPACE_ID: ${DASHSCOPE_WORKSPACE_ID:-}
  DASHSCOPE_COMPATIBLE_BASE_URL: ${DASHSCOPE_COMPATIBLE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
  QWEN_VL_API_KEY: ${QWEN_VL_API_KEY:-}
  QWEN_VL_BASE_URL: ${QWEN_VL_BASE_URL:-}
  QWEN_VL_ALLOWED_HOSTS: ${QWEN_VL_ALLOWED_HOSTS:-}
  QWEN_VL_MODEL: ${QWEN_VL_MODEL:-qwen3.8-max}
  QWEN_VL_MAX_OUTPUT_TOKENS: ${QWEN_VL_MAX_OUTPUT_TOKENS:-2048}
  QWEN_VL_ENABLE_THINKING: "true"
  QWEN_VL_THINKING_BUDGET: "8192"
  QWEN_VL_HIGH_RESOLUTION_IMAGES: ${QWEN_VL_HIGH_RESOLUTION_IMAGES:-false}
  ALIBABA_EMBEDDING_MODEL: ${ALIBABA_EMBEDDING_MODEL:-text-embedding-v4}
  ALIBABA_EMBEDDING_DIMENSIONS: ${ALIBABA_EMBEDDING_DIMENSIONS:-1024}
  ALIBABA_ACCESS_KEY_ID: ${ALIBABA_ACCESS_KEY_ID:-}
  ALIBABA_ACCESS_KEY_SECRET: ${ALIBABA_ACCESS_KEY_SECRET:-}
  ALIBABA_SECURITY_TOKEN: ${ALIBABA_SECURITY_TOKEN:-}
  ALIBABA_DIRECTMAIL_ACCESS_KEY_ID: ${ALIBABA_DIRECTMAIL_ACCESS_KEY_ID:-}
  ALIBABA_DIRECTMAIL_ACCESS_KEY_SECRET: ${ALIBABA_DIRECTMAIL_ACCESS_KEY_SECRET:-}
  ALIBABA_DIRECTMAIL_SECURITY_TOKEN: ${ALIBABA_DIRECTMAIL_SECURITY_TOKEN:-}
  ALIBABA_DIRECTMAIL_ACCOUNT_NAME: ${ALIBABA_DIRECTMAIL_ACCOUNT_NAME:-no-reply@mail.openvac.cn}
  ALIBABA_DIRECTMAIL_REGION: ${ALIBABA_DIRECTMAIL_REGION:-cn-hangzhou}
  ALIBABA_DIRECTMAIL_ENDPOINT: ${ALIBABA_DIRECTMAIL_ENDPOINT:-dm.aliyuncs.com}
  ALIBABA_OCR_ENDPOINT: ${ALIBABA_OCR_ENDPOINT:-docmind-api.cn-hangzhou.aliyuncs.com}
  ALIBABA_OCR_ALLOWED_DOCUMENT_HOSTS: ${ALIBABA_OCR_ALLOWED_DOCUMENT_HOSTS:-}
  ALIBABA_OSS_REGION: ${ALIBABA_OSS_REGION:-}
  ALIBABA_OSS_ENDPOINT: ${ALIBABA_OSS_ENDPOINT:-}
  ALIBABA_OSS_BUCKET: ${ALIBABA_OSS_BUCKET:-}
  ALIBABA_OSS_ACCESS_KEY_ID: ${ALIBABA_OSS_ACCESS_KEY_ID:-}
  ALIBABA_OSS_ACCESS_KEY_SECRET: ${ALIBABA_OSS_ACCESS_KEY_SECRET:-}
  ALIBABA_OSS_SECURITY_TOKEN: ${ALIBABA_OSS_SECURITY_TOKEN:-}
  ANSWER_DAILY_LIMIT: ${ANSWER_DAILY_LIMIT:-20}
  MODEL_ATTEMPT_PER_USER_DAILY_LIMIT: ${MODEL_ATTEMPT_PER_USER_DAILY_LIMIT:-30}
  MODEL_ATTEMPT_GLOBAL_DAILY_LIMIT: ${MODEL_ATTEMPT_GLOBAL_DAILY_LIMIT:-1000}
  WEB_SEARCH_PER_USER_DAILY_LIMIT: ${WEB_SEARCH_PER_USER_DAILY_LIMIT:-${ALIBABA_WEB_SEARCH_PER_USER_DAILY_LIMIT:-5}}
  WEB_SEARCH_GLOBAL_DAILY_LIMIT: ${WEB_SEARCH_GLOBAL_DAILY_LIMIT:-${ALIBABA_WEB_SEARCH_GLOBAL_DAILY_LIMIT:-500}}
  WEB_SEARCH_ALLOWED_DOMAINS: ${WEB_SEARCH_ALLOWED_DOMAINS:-${ALIBABA_WEB_SEARCH_ALLOWED_DOMAINS:-cds.cern.ch,nist.gov,hse.gov.uk,iso.org,leybold.com,leybold.cn,pfeiffer-vacuum.com,edwardsvacuum.com,buschvacuum.com,atlascopco.com}}
  # One-release previous-image rollback aliases. Alibaba web stays disabled.
  ALIBABA_WEB_SEARCH_ENABLED: "false"
  ALIBABA_WEB_SEARCH_PER_USER_DAILY_LIMIT: ${ALIBABA_WEB_SEARCH_PER_USER_DAILY_LIMIT:-${WEB_SEARCH_PER_USER_DAILY_LIMIT:-5}}
  ALIBABA_WEB_SEARCH_GLOBAL_DAILY_LIMIT: ${ALIBABA_WEB_SEARCH_GLOBAL_DAILY_LIMIT:-${WEB_SEARCH_GLOBAL_DAILY_LIMIT:-500}}
  ALIBABA_WEB_SEARCH_ALLOWED_DOMAINS: ${ALIBABA_WEB_SEARCH_ALLOWED_DOMAINS:-${WEB_SEARCH_ALLOWED_DOMAINS:-cds.cern.ch,nist.gov,hse.gov.uk,iso.org,leybold.com,leybold.cn,pfeiffer-vacuum.com,edwardsvacuum.com,buschvacuum.com,atlascopco.com}}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
  ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
  PROBLEM_REPORT_NOTIFICATION_EMAIL: ${PROBLEM_REPORT_NOTIFICATION_EMAIL:-}
  OPERATOR_NAME: ${OPERATOR_NAME:-}
  OPERATOR_ADDRESS: ${OPERATOR_ADDRESS:-}
  PUBLIC_CONTACT_EMAIL: ${PUBLIC_CONTACT_EMAIL:-}
  LEGAL_COMPLAINT_EMAIL: ${LEGAL_COMPLAINT_EMAIL:-}
  ICP_FILING_NUMBER: ${ICP_FILING_NUMBER:-}
  GEN_AI_FILING_NUMBER: ${GEN_AI_FILING_NUMBER:-}
  ALLOW_DEVELOPMENT_MOCKS: "false"
  KNOWLEDGE_REVIEW_AUTOMATION_TOKEN_SHA256: ${KNOWLEDGE_REVIEW_AUTOMATION_TOKEN_SHA256:-}

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openvac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-openvac}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-openvac} -d ${POSTGRES_DB:-openvac}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend

  migrate:
    image: ${OPENVAC_IMAGE:-openvac-web:local}
    build:
      context: .
      target: web
    command: ["pnpm", "db:migrate"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - backend

  web:
    image: ${OPENVAC_IMAGE:-openvac-web:local}
    build:
      context: .
      target: web
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${OPENVAC_PORT:-3010}:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend
      - edge

  worker:
    image: ${OPENVAC_IMAGE:-openvac-web:local}
    build:
      context: .
      target: web
    command: ["pnpm", "worker"]
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
      - edge

networks:
  backend:
    internal: true
  edge:

volumes:
  postgres-data:
