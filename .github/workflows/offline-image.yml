name: Build offline ECS image

on:
  pull_request:
    paths:
      - .github/workflows/offline-image.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: offline-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build pinned linux/amd64 image archive
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: web
          platforms: linux/amd64
          push: false
          tags: openvac-web-staging:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/openvac-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Compress and checksum archive
        run: |
          zstd --threads=0 --rm "$RUNNER_TEMP/openvac-image.tar"
          cd "$RUNNER_TEMP"
          sha256sum openvac-image.tar.zst > openvac-image.tar.zst.sha256
      - name: Upload one-day deployment artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openvac-image-${{ github.sha }}-linux-amd64
          path: |
            ${{ runner.temp }}/openvac-image.tar.zst
            ${{ runner.temp }}/openvac-image.tar.zst.sha256
          if-no-files-found: error
          retention-days: 1
