name: Build and deploy

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character commit SHA that already passed CI
        required: true
        type: string
      target:
        description: Deployment target
        required: true
        type: choice
        options:
          - staging
          - production
      staging_web_digest:
        description: Exact staging sha256 digest (required for production or archive reuse)
        required: false
        type: string
      reuse_run_id:
        description: Successful release workflow run ID whose exact staging archive should be reused
        required: false
        type: string
      reuse_run_attempt:
        description: Successful attempt number within reuse_run_id
        required: false
        type: string

permissions: {}

concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  ci_gate:
    name: Verify successful CI for release commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse unverified or ambiguous revisions
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_SHA: ${{ inputs.commit_sha }}
          TARGET: ${{ inputs.target }}
          STAGING_WEB_DIGEST: ${{ inputs.staging_web_digest }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
          REUSE_RUN_ATTEMPT: ${{ inputs.reuse_run_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          case "$RELEASE_SHA" in
            ""|*[!0-9a-f]*)
              echo "commit_sha must be a lowercase hexadecimal commit SHA" >&2
              exit 64
              ;;
          esac
          test "${#RELEASE_SHA}" -eq 40

          reuse_requested=false
          if [ -n "$REUSE_RUN_ID" ] || [ -n "$REUSE_RUN_ATTEMPT" ]; then
            if [ -z "$REUSE_RUN_ID" ] || [ -z "$REUSE_RUN_ATTEMPT" ]; then
              echo "reuse_run_id and reuse_run_attempt must be provided together." >&2
              exit 64
            fi
            case "$REUSE_RUN_ID:$REUSE_RUN_ATTEMPT" in
              *[!0-9:]*|:*|*:) echo "Archive reuse identifiers must contain decimal digits only." >&2; exit 64 ;;
            esac
            reuse_requested=true
          fi

          case "$TARGET" in
            staging)
              if [ "$reuse_requested" = true ]; then
                case "$STAGING_WEB_DIGEST" in
                  sha256:*) staging_digest_hex="${STAGING_WEB_DIGEST#sha256:}" ;;
                  *)
                    echo "Archive reuse requires staging_web_digest in sha256:<64 lowercase hex> form." >&2
                    exit 64
                    ;;
                esac
                case "$staging_digest_hex" in
                  ""|*[!0-9a-f]*)
                    echo "staging_web_digest must contain lowercase hexadecimal only." >&2
                    exit 64
                    ;;
                esac
                if [ "${#staging_digest_hex}" -ne 64 ]; then
                  echo "staging_web_digest must contain exactly 64 hexadecimal characters." >&2
                  exit 64
                fi
              elif [ -n "$STAGING_WEB_DIGEST" ]; then
                echo "staging_web_digest must be empty for a staging release; staging builds the image once." >&2
                exit 64
              fi
              ;;
            production)
              if [ "$reuse_requested" = true ]; then
                echo "Archive reuse is only allowed while re-validating staging; production still consumes staging provenance." >&2
                exit 64
              fi
              case "$STAGING_WEB_DIGEST" in
                sha256:*) staging_digest_hex="${STAGING_WEB_DIGEST#sha256:}" ;;
                *)
                  echo "Production requires staging_web_digest in sha256:<64 lowercase hex> form." >&2
                  exit 64
                  ;;
              esac
              case "$staging_digest_hex" in
                ""|*[!0-9a-f]*)
                  echo "staging_web_digest must contain lowercase hexadecimal only." >&2
                  exit 64
                  ;;
              esac
              if [ "${#staging_digest_hex}" -ne 64 ]; then
                echo "staging_web_digest must contain exactly 64 hexadecimal characters." >&2
                exit 64
              fi
              ;;
            *)
              echo "target must be staging or production." >&2
              exit 64
              ;;
          esac

          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "Dispatch this workflow from the default branch ($DEFAULT_BRANCH)." >&2
            exit 64
          fi

          default_head="$(git rev-parse HEAD)"
          if ! git cat-file -e "${RELEASE_SHA}^{commit}" 2>/dev/null ||
            ! git merge-base --is-ancestor "$RELEASE_SHA" "$default_head"; then
            echo "commit_sha must be reachable from the current default branch history." >&2
            exit 64
          fi

          response="$RUNNER_TEMP/openvac-ci-runs.json"
          curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$RELEASE_SHA&status=success&per_page=100" \
            --output "$response"

          ci_run_url="$(
            jq --exit-status --raw-output \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg default_branch "$DEFAULT_BRANCH" \
              --arg sha "$RELEASE_SHA" \
              '[.workflow_runs[] |
                select(
                  .head_sha == $sha and
                  .status == "completed" and
                  .conclusion == "success" and
                  .head_repository.full_name == $repository and
                  (.event == "push" or .event == "workflow_dispatch") and
                  .head_branch == $default_branch
                )][0].html_url // empty' \
              "$response"
          )"
          test -n "$ci_run_url"
          echo "Release commit passed CI: $ci_run_url"

          if [ "$reuse_requested" = true ]; then
            source_attempt_response="$RUNNER_TEMP/openvac-reuse-run-attempt.json"
            curl --fail-with-body --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN_ID/attempts/$REUSE_RUN_ATTEMPT" \
              --output "$source_attempt_response"
            jq --exit-status \
              --arg sha "$RELEASE_SHA" \
              --arg default_branch "$DEFAULT_BRANCH" \
              --argjson attempt "$REUSE_RUN_ATTEMPT" '
                .head_sha == $sha and
                .head_branch == $default_branch and
                .event == "workflow_dispatch" and
                .path == ".github/workflows/release.yml" and
                .run_attempt == $attempt and
                .status == "completed" and
                .conclusion == "success"
              ' "$source_attempt_response" >/dev/null || {
                echo "Archive reuse requires an exact successful release workflow attempt for commit_sha." >&2
                exit 1
              }

            source_artifact_name="openvac-web-release-$REUSE_RUN_ID-$REUSE_RUN_ATTEMPT"
            source_artifacts_response="$RUNNER_TEMP/openvac-reuse-artifacts.json"
            curl --fail-with-body --silent --show-error \
              --get \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              --data-urlencode "name=$source_artifact_name" \
              --data-urlencode "per_page=100" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts" \
              --output "$source_artifacts_response"
            jq --exit-status \
              --arg name "$source_artifact_name" \
              --argjson run_id "$REUSE_RUN_ID" '
                any(
                  .artifacts[]?;
                  .name == $name and
                  .expired == false and
                  .workflow_run.id == $run_id
                )
              ' "$source_artifacts_response" >/dev/null || {
                echo "The exact source deployment archive is missing or expired." >&2
                exit 1
              }
            echo "Accepted immutable archive from release run $REUSE_RUN_ID attempt $REUSE_RUN_ATTEMPT."
          fi

          if [ "$TARGET" = production ]; then
            environment_response="$RUNNER_TEMP/openvac-production-environment.json"
            curl --fail-with-body --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/environments/production" \
              --output "$environment_response"
            jq --exit-status '
              any(
                .protection_rules[]?;
                .type == "required_reviewers" and
                (.reviewers | length) > 0
              ) and
              (
                .deployment_branch_policy.protected_branches == true or
                .deployment_branch_policy.custom_branch_policies == true
              )
            ' "$environment_response" >/dev/null
            echo "Production environment has required reviewers and a branch policy."

            deployments_response="$RUNNER_TEMP/openvac-staging-deployments.json"
            curl --fail-with-body --silent --show-error \
              --get \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              --data-urlencode "environment=staging" \
              --data-urlencode "sha=$RELEASE_SHA" \
              --data-urlencode "per_page=100" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/deployments" \
              --output "$deployments_response"
            staging_statuses_url="$(
              jq --raw-output \
                --arg sha "$RELEASE_SHA" \
                '[.[] |
                  select(.sha == $sha and .environment == "staging")] |
                  sort_by(.id) |
                  .[-1].statuses_url // empty' \
                "$deployments_response"
            )"
            case "$staging_statuses_url" in
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/deployments/"*/statuses) ;;
              *)
                echo "Production requires a prior staging deployment for the same commit SHA." >&2
                exit 1
                ;;
            esac
            staging_statuses_response="$RUNNER_TEMP/openvac-staging-deployment-statuses.json"
            curl --fail-with-body --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "$staging_statuses_url" \
              --output "$staging_statuses_response"
            jq --exit-status 'sort_by(.id) | .[-1].state == "success"' \
              "$staging_statuses_response" >/dev/null
            echo "The latest same-SHA staging deployment status is success."

            provenance_name="openvac-staging-provenance-$RELEASE_SHA-$staging_digest_hex"
            artifacts_response="$RUNNER_TEMP/openvac-staging-provenance-artifacts.json"
            curl --fail-with-body --silent --show-error \
              --get \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              --data-urlencode "name=$provenance_name" \
              --data-urlencode "per_page=100" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts" \
              --output "$artifacts_response"
            provenance_run_id="$(
              jq --raw-output \
                --arg name "$provenance_name" \
                --arg sha "$RELEASE_SHA" \
                '[.artifacts[] |
                  select(
                    .name == $name and
                    .expired == false and
                    .workflow_run.head_sha == $sha
                  )] |
                  sort_by(.id) |
                  .[-1].workflow_run.id // empty' \
                "$artifacts_response"
            )"
            if [ -z "$provenance_run_id" ]; then
              echo "Production requires an unexpired staging provenance artifact for this commit and digest." >&2
              exit 1
            fi

            provenance_run_response="$RUNNER_TEMP/openvac-staging-provenance-run.json"
            curl --fail-with-body --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$provenance_run_id" \
              --output "$provenance_run_response"
            jq --exit-status \
              --arg sha "$RELEASE_SHA" \
              --arg default_branch "$DEFAULT_BRANCH" '
                .head_sha == $sha and
                .head_branch == $default_branch and
                .event == "workflow_dispatch" and
                .path == ".github/workflows/release.yml" and
                .status == "completed" and
                .conclusion == "success"
              ' "$provenance_run_response" >/dev/null || {
                echo "The staging provenance artifact is not attached to a successful release workflow run." >&2
                exit 1
              }
            echo "Accepted staging digest provenance: $STAGING_WEB_DIGEST"
          fi

  image:
    needs: ci_gate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
    outputs:
      web_digest: ${{ steps.select_image.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - if: inputs.target == 'staging' && inputs.reuse_run_id == ''
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - if: inputs.target == 'production' || inputs.reuse_run_id == ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: inputs.target == 'staging' && inputs.reuse_run_id == ''
        id: web_meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=sha-${{ inputs.commit_sha }}
      - if: inputs.target == 'staging' && inputs.reuse_run_id == ''
        id: web_build
        name: Build and publish the production-target web image once
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: web
          platforms: linux/amd64
          push: true
          tags: ${{ steps.web_meta.outputs.tags }}
          labels: |
            ${{ steps.web_meta.outputs.labels }}
            org.opencontainers.image.revision=${{ inputs.commit_sha }}
          build-args: OPENVAC_DEPLOY_TARGET=production
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: select_image
        name: Select the exact staging-built digest
        env:
          TARGET: ${{ inputs.target }}
          BUILT_WEB_DIGEST: ${{ steps.web_build.outputs.digest }}
          STAGING_WEB_DIGEST: ${{ inputs.staging_web_digest }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        run: |
          set -Eeuo pipefail
          case "$TARGET" in
            staging)
              if [ -n "$REUSE_RUN_ID" ]; then
                selected_digest="$STAGING_WEB_DIGEST"
              else
                selected_digest="$BUILT_WEB_DIGEST"
              fi
              ;;
            production) selected_digest="$STAGING_WEB_DIGEST" ;;
            *)
              echo "target must be staging or production." >&2
              exit 64
              ;;
          esac
          case "$selected_digest" in
            sha256:*) digest_hex="${selected_digest#sha256:}" ;;
            *)
              echo "Selected web image digest must use sha256:<64 lowercase hex>." >&2
              exit 64
              ;;
          esac
          case "$digest_hex" in
            ""|*[!0-9a-f]*)
              echo "Selected web image digest must contain lowercase hexadecimal only." >&2
              exit 64
              ;;
          esac
          if [ "${#digest_hex}" -ne 64 ]; then
            echo "Selected web image digest must contain exactly 64 hexadecimal characters." >&2
            exit 64
          fi
          echo "digest=$selected_digest" >>"$GITHUB_OUTPUT"
          echo "digest_hex=$digest_hex" >>"$GITHUB_OUTPUT"
      - if: inputs.reuse_run_id == ''
        name: Package the exact registry digest without rebuilding
        env:
          RELEASE_SHA: ${{ inputs.commit_sha }}
          WEB_IMAGE_DIGEST: ${{ steps.select_image.outputs.digest }}
        run: |
          set -Eeuo pipefail
          image_repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          registry_image="$image_repository@$WEB_IMAGE_DIGEST"
          archive_tag="$image_repository:archive-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

          docker pull --platform linux/amd64 "$registry_image"
          digest_found=false
          for repo_digest in $(
            docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' \
              "$registry_image"
          ); do
            if [ "$repo_digest" = "$registry_image" ]; then
              digest_found=true
              break
            fi
          done
          if [ "$digest_found" != true ]; then
            echo "Pulled image does not expose the selected immutable registry digest." >&2
            exit 1
          fi

          revision="$(
            docker image inspect \
              --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' \
              "$registry_image"
          )"
          if [ "$revision" != "$RELEASE_SHA" ]; then
            echo "Selected web image revision does not match commit_sha." >&2
            exit 1
          fi

          docker image tag "$registry_image" "$archive_tag"
          docker image save --output "$RUNNER_TEMP/openvac-web-release.tar" \
            "$archive_tag"
          printf '%s\n' "$WEB_IMAGE_DIGEST" \
            >"$RUNNER_TEMP/openvac-web-release.digest"
      - if: inputs.reuse_run_id == ''
        name: Compress and checksum the web deployment archive
        run: |
          set -Eeuo pipefail
          zstd --threads=0 --rm "$RUNNER_TEMP/openvac-web-release.tar"
          cd "$RUNNER_TEMP"
          sha256sum openvac-web-release.tar.zst > openvac-web-release.tar.zst.sha256
          sha256sum openvac-web-release.digest > openvac-web-release.digest.sha256
      - if: inputs.target == 'staging' && inputs.reuse_run_id != ''
        name: Download the exact successful deployment archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: openvac-web-release-${{ inputs.reuse_run_id }}-${{ inputs.reuse_run_attempt }}
          path: ${{ runner.temp }}/openvac-web-release-reused
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.reuse_run_id }}
      - if: inputs.target == 'staging' && inputs.reuse_run_id != ''
        name: Verify and normalize the reused deployment archive
        env:
          WEB_IMAGE_DIGEST: ${{ steps.select_image.outputs.digest }}
        run: |
          set -Eeuo pipefail
          source_dir="$RUNNER_TEMP/openvac-web-release-reused"
          test -f "$source_dir/openvac-web-release.tar.zst" && test ! -L "$source_dir/openvac-web-release.tar.zst"
          test -f "$source_dir/openvac-web-release.tar.zst.sha256" && test ! -L "$source_dir/openvac-web-release.tar.zst.sha256"
          test -f "$source_dir/openvac-web-release.digest" && test ! -L "$source_dir/openvac-web-release.digest"
          test -f "$source_dir/openvac-web-release.digest.sha256" && test ! -L "$source_dir/openvac-web-release.digest.sha256"
          (
            cd "$source_dir"
            sha256sum --check openvac-web-release.tar.zst.sha256
            sha256sum --check openvac-web-release.digest.sha256
          )
          reused_digest="$(cat "$source_dir/openvac-web-release.digest")"
          if [ "$reused_digest" != "$WEB_IMAGE_DIGEST" ]; then
            echo "Reused deployment archive digest does not match staging_web_digest." >&2
            exit 1
          fi
          cp "$source_dir/openvac-web-release.tar.zst" "$RUNNER_TEMP/openvac-web-release.tar.zst"
          cp "$source_dir/openvac-web-release.tar.zst.sha256" "$RUNNER_TEMP/openvac-web-release.tar.zst.sha256"
          cp "$source_dir/openvac-web-release.digest" "$RUNNER_TEMP/openvac-web-release.digest"
          cp "$source_dir/openvac-web-release.digest.sha256" "$RUNNER_TEMP/openvac-web-release.digest.sha256"
      - name: Upload the same-run web deployment archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openvac-web-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/openvac-web-release.tar.zst
            ${{ runner.temp }}/openvac-web-release.tar.zst.sha256
            ${{ runner.temp }}/openvac-web-release.digest
            ${{ runner.temp }}/openvac-web-release.digest.sha256
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: [ci_gate, image]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    environment:
      name: ${{ inputs.target }}
      url: ${{ inputs.target == 'production' && 'https://openvac.cn' || 'https://staging-openvac.openvac.cn' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - name: Download the same-run web deployment archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: openvac-web-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openvac-web-release
      - name: Configure SSH
        env:
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ECS_SSH_KEY" >"$HOME/.ssh/openvac"
          chmod 600 "$HOME/.ssh/openvac"
          printf '%s\n' "$ECS_KNOWN_HOSTS" >"$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - id: deploy
        name: Activate immutable web-only release
        env:
          TARGET: ${{ inputs.target }}
          RELEASE_SHA: ${{ inputs.commit_sha }}
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          WEB_IMAGE_DIGEST: ${{ needs.image.outputs.web_digest }}
        run: |
          set -Eeuo pipefail
          case "$TARGET" in
            production)
              deploy_dir=/opt/openvac
              compose_project=openvac-production
              health_url=https://openvac.cn/api/health
              ;;
            staging)
              deploy_dir=/opt/openvac-staging
              compose_project=openvac-staging
              health_url=https://staging-openvac.openvac.cn/api/health
              ;;
            *) exit 64 ;;
          esac
          case "$RELEASE_SHA" in ""|*[!0-9a-f]*) exit 64 ;; esac
          test "${#RELEASE_SHA}" -eq 40
          case "$WEB_IMAGE_DIGEST" in sha256:*) web_digest="${WEB_IMAGE_DIGEST#sha256:}" ;; *) exit 64 ;; esac
          case "$web_digest" in ""|*[!0-9a-f]*) exit 64 ;; esac
          test "${#web_digest}" -eq 64

          image_repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          release_registry_image="$image_repository@$WEB_IMAGE_DIGEST"
          archive_dir="$RUNNER_TEMP/openvac-web-release"
          archive="$archive_dir/openvac-web-release.tar.zst"
          archive_checksum="$archive.sha256"
          archive_digest="$archive_dir/openvac-web-release.digest"
          archive_digest_checksum="$archive_digest.sha256"
          test -f "$archive" && test ! -L "$archive"
          test -f "$archive_checksum" && test ! -L "$archive_checksum"
          test -f "$archive_digest" && test ! -L "$archive_digest"
          test -f "$archive_digest_checksum" && test ! -L "$archive_digest_checksum"
          (cd "$archive_dir" && sha256sum --check "$(basename "$archive_checksum")")
          (cd "$archive_dir" && sha256sum --check "$(basename "$archive_digest_checksum")")
          packaged_digest="$(cat "$archive_digest")"
          if [ "$packaged_digest" != "$WEB_IMAGE_DIGEST" ]; then
            echo "Deployment archive digest does not match the selected staging digest." >&2
            exit 1
          fi

          bundle_root="$RUNNER_TEMP/openvac-deploy-$RELEASE_SHA"
          bundle_archive="$RUNNER_TEMP/openvac-deploy-bundle.tar.gz"
          bundle_checksum="$bundle_archive.sha256"
          install -d -m 700 "$bundle_root"
          cp docker-compose.yml "$bundle_root/docker-compose.yml"
          cp -R deploy "$bundle_root/deploy"
          cp "$archive_digest" "$bundle_root/WEB_IMAGE_DIGEST"
          (
            cd "$bundle_root"
            find docker-compose.yml deploy WEB_IMAGE_DIGEST -type f -print |
              LC_ALL=C sort |
              xargs sha256sum >DEPLOY_BUNDLE.sha256
          )
          tar -czf "$bundle_archive" -C "$bundle_root"             docker-compose.yml deploy WEB_IMAGE_DIGEST DEPLOY_BUNDLE.sha256
          (
            cd "$RUNNER_TEMP"
            sha256sum "$(basename "$bundle_archive")" >"$(basename "$bundle_checksum")"
          )

          remote_stage="/tmp/openvac-deploy-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh_base="${ECS_USER}@${ECS_HOST}"
          cleanup() {
            ssh -i "$HOME/.ssh/openvac" -o BatchMode=yes "$ssh_base"               "case '$remote_stage' in /tmp/openvac-deploy-*) rm -rf -- '$remote_stage' ;; esac"               >/dev/null 2>&1 || true
          }
          trap cleanup EXIT HUP INT TERM
          ssh -i "$HOME/.ssh/openvac" -o BatchMode=yes "$ssh_base"             "install -d -m 700 '$remote_stage'"
          scp -i "$HOME/.ssh/openvac" -o BatchMode=yes             "$archive" "$archive_checksum" "$bundle_archive" "$bundle_checksum"             "$ssh_base:$remote_stage/"

          loaded_web_id="$(
            ssh -i "$HOME/.ssh/openvac" -o BatchMode=yes "$ssh_base"               sh -s -- "$remote_stage" "$RELEASE_SHA" "$image_repository:archive-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "$WEB_IMAGE_DIGEST" <<'REMOTE_PREPARE'
          set -eu
          remote_stage="$1"
          release_id="$2"
          loaded_tag="$3"
          expected_registry_digest="$4"
          case "$remote_stage" in /tmp/openvac-deploy-*) ;; *) exit 64 ;; esac
          cd "$remote_stage"
          sha256sum --check openvac-web-release.tar.zst.sha256 >&2
          sha256sum --check openvac-deploy-bundle.tar.gz.sha256 >&2
          install -d -m 700 bundle
          tar -xzf openvac-deploy-bundle.tar.gz -C bundle
          (cd bundle && sha256sum --check DEPLOY_BUNDLE.sha256 >&2)
          packaged_registry_digest="$(cat bundle/WEB_IMAGE_DIGEST)"
          if [ "$packaged_registry_digest" != "$expected_registry_digest" ]; then
            echo "Remote deployment bundle digest does not match the selected staging digest" >&2
            exit 1
          fi
          zstd --decompress --stdout openvac-web-release.tar.zst | docker load >/dev/null
          loaded_id="$(docker image inspect --format '{{.Id}}' "$loaded_tag")"
          revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$loaded_tag")"
          architecture="$(docker image inspect --format '{{.Architecture}}' "$loaded_tag")"
          [ "$revision" = "$release_id" ] || {
            echo "Loaded web image revision does not match the release commit" >&2
            exit 1
          }
          [ "$architecture" = amd64 ] || {
            echo "Loaded web image is not linux/amd64" >&2
            exit 1
          }
          case "$loaded_id" in sha256:*) ;; *) exit 1 ;; esac
          loaded_hex="${loaded_id#sha256:}"
          case "$loaded_hex" in ""|*[!0-9a-f]*) exit 1 ;; esac
          [ "${#loaded_hex}" -eq 64 ] || exit 1
          docker image tag "$loaded_tag" "openvac-web-release:$loaded_hex"
          printf '%s\n' "$loaded_id"
          REMOTE_PREPARE
          )"
          case "$loaded_web_id" in sha256:*) loaded_hex="${loaded_web_id#sha256:}" ;; *) exit 1 ;; esac
          release_image="openvac-web-release:$loaded_hex"

          ssh -i "$HOME/.ssh/openvac" -o BatchMode=yes "$ssh_base"             sh -s -- "$remote_stage" "$deploy_dir" "$RELEASE_SHA"             "$release_image" "$loaded_web_id" "$compose_project" "$health_url" <<'REMOTE_ACTIVATE'
          set -eu
          remote_stage="$1"
          deploy_dir="$2"
          release_id="$3"
          release_image="$4"
          loaded_web_id="$5"
          compose_project="$6"
          health_url="$7"
          case "$remote_stage" in /tmp/openvac-deploy-*) ;; *) exit 64 ;; esac
          OPENVAC_WEB_PRELOADED_ID="$loaded_web_id"             sh "$remote_stage/bundle/deploy/activate-bundle.sh"             "$deploy_dir" "$release_id" "$remote_stage/bundle"             "$release_image" "$compose_project" "$health_url"
          REMOTE_ACTIVATE

          {
            echo "### Web-only deployment"
            echo
            printf -- '- Target: `%s`\n' "$TARGET"
            printf -- '- Commit: `%s`\n' "$RELEASE_SHA"
            printf -- '- Registry image: `%s`\n' "$release_registry_image"
            printf -- '- Loaded image ID: `%s`\n' "$loaded_web_id"
          } >>"$GITHUB_STEP_SUMMARY"
          echo "digest_hex=$web_digest" >>"$GITHUB_OUTPUT"
          if [ "$TARGET" = staging ]; then
            jq --null-input \
              --arg commit_sha "$RELEASE_SHA" \
              --arg staging_web_digest "$WEB_IMAGE_DIGEST" \
              '{
                commit_sha: $commit_sha,
                staging_web_digest: $staging_web_digest
              }' >"$RUNNER_TEMP/openvac-staging-provenance.json"
          fi
          trap - EXIT HUP INT TERM
          cleanup
      - if: inputs.target == 'staging'
        name: Save accepted staging digest provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openvac-staging-provenance-${{ inputs.commit_sha }}-${{ steps.deploy.outputs.digest_hex }}
          path: ${{ runner.temp }}/openvac-staging-provenance.json
          if-no-files-found: error
          retention-days: 30
