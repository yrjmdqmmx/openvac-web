name: Knowledge review operations

on:
  workflow_dispatch:
    inputs:
      expected_release_sha:
        description: Exact production release SHA currently recorded on the server
        required: true
        type: string
      mode:
        description: Preview/apply pending knowledge, retry one exact job or verify report, or diagnose one API request
        required: true
        default: preview
        type: choice
        options:
          - preview
          - apply
          - retry-embedding-job
          - retry-verify-evidence
          - diagnose-review-pair
          - diagnose-request
      confirmation:
        description: Enter REQUEUE_PENDING, RETRY_EMBEDDING_JOB, or RETRY_VERIFY_EVIDENCE for its exact operation
        required: false
        type: string
      diagnostic_request_id:
        description: Lowercase request UUID, required only for diagnose-request
        required: false
        type: string
      retry_document_id:
        description: Exact knowledge document UUID, required only for an exact retry/diagnosis
        required: false
        type: string
      retry_version_id:
        description: Exact current knowledge version UUID, required only for an exact retry/diagnosis
        required: false
        type: string
      retry_run_id:
        description: Exact needs-human verify run UUID, required only for retry-verify-evidence
        required: false
        type: string
      retry_content_hash:
        description: Exact lowercase current content SHA-256, required only for an exact retry/diagnosis
        required: false
        type: string

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  requeue:
    name: Run protected production knowledge operation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://openvac.cn/admin/knowledge
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the requested operation
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
          DIAGNOSTIC_REQUEST_ID: ${{ inputs.diagnostic_request_id }}
          RETRY_DOCUMENT_ID: ${{ inputs.retry_document_id }}
          RETRY_VERSION_ID: ${{ inputs.retry_version_id }}
          RETRY_RUN_ID: ${{ inputs.retry_run_id }}
          RETRY_CONTENT_HASH: ${{ inputs.retry_content_hash }}
        run: |
          set -Eeuo pipefail
          case "$EXPECTED_RELEASE_SHA" in
            ""|*[!0-9a-f]*)
              echo "expected_release_sha must be lowercase hexadecimal" >&2
              exit 64
              ;;
          esac
          test "${#EXPECTED_RELEASE_SHA}" -eq 40
          git cat-file -e "$EXPECTED_RELEASE_SHA^{commit}"
          git merge-base --is-ancestor "$EXPECTED_RELEASE_SHA" HEAD
          retry_values="$RETRY_DOCUMENT_ID$RETRY_VERSION_ID$RETRY_RUN_ID$RETRY_CONTENT_HASH"
          case "$MODE" in
            preview)
              test -z "$CONFIRMATION" || {
                echo "confirmation must be empty in preview mode" >&2
                exit 64
              }
              test -z "$DIAGNOSTIC_REQUEST_ID"
              test -z "$retry_values"
              ;;
            apply)
              test "$CONFIRMATION" = REQUEUE_PENDING || {
                echo "apply mode requires the exact confirmation REQUEUE_PENDING" >&2
                exit 64
              }
              test -z "$DIAGNOSTIC_REQUEST_ID"
              test -z "$retry_values"
              ;;
            retry-embedding-job)
              test "$CONFIRMATION" = RETRY_EMBEDDING_JOB || {
                echo "retry-embedding-job requires the exact confirmation RETRY_EMBEDDING_JOB" >&2
                exit 64
              }
              test -z "$DIAGNOSTIC_REQUEST_ID"
              test -z "$RETRY_RUN_ID"
              for retry_uuid in "$RETRY_DOCUMENT_ID" "$RETRY_VERSION_ID"; do
                printf '%s\n' "$retry_uuid" |
                  grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
              done
              printf '%s\n' "$RETRY_CONTENT_HASH" | grep -Eq '^[0-9a-f]{64}$'
              ;;
            retry-verify-evidence)
              test "$CONFIRMATION" = RETRY_VERIFY_EVIDENCE || {
                echo "retry-verify-evidence requires the exact confirmation RETRY_VERIFY_EVIDENCE" >&2
                exit 64
              }
              test -z "$DIAGNOSTIC_REQUEST_ID"
              for retry_uuid in "$RETRY_DOCUMENT_ID" "$RETRY_VERSION_ID" "$RETRY_RUN_ID"; do
                printf '%s\n' "$retry_uuid" |
                  grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
              done
              printf '%s\n' "$RETRY_CONTENT_HASH" | grep -Eq '^[0-9a-f]{64}$'
              ;;
            diagnose-review-pair)
              test -z "$CONFIRMATION" || {
                echo "diagnose-review-pair requires empty confirmation" >&2
                exit 64
              }
              test -z "$DIAGNOSTIC_REQUEST_ID"
              for retry_uuid in "$RETRY_DOCUMENT_ID" "$RETRY_VERSION_ID" "$RETRY_RUN_ID"; do
                printf '%s\n' "$retry_uuid" |
                  grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
              done
              printf '%s\n' "$RETRY_CONTENT_HASH" | grep -Eq '^[0-9a-f]{64}$'
              ;;
            diagnose-request)
              test -z "$CONFIRMATION" || {
                echo "confirmation must be empty in diagnose-request mode" >&2
                exit 64
              }
              printf '%s\n' "$DIAGNOSTIC_REQUEST_ID" |
                grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
              test -z "$retry_values"
              ;;
            *) exit 64 ;;
          esac
          sh -n deploy/run-knowledge-review-operation.sh
      - name: Configure SSH
        env:
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ECS_SSH_KEY" >"$HOME/.ssh/openvac"
          chmod 600 "$HOME/.ssh/openvac"
          printf '%s\n' "$ECS_KNOWN_HOSTS" >"$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Run the release-bound operation
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
          MODE: ${{ inputs.mode }}
          DIAGNOSTIC_REQUEST_ID: ${{ inputs.diagnostic_request_id }}
          RETRY_DOCUMENT_ID: ${{ inputs.retry_document_id }}
          RETRY_VERSION_ID: ${{ inputs.retry_version_id }}
          RETRY_RUN_ID: ${{ inputs.retry_run_id }}
          RETRY_CONTENT_HASH: ${{ inputs.retry_content_hash }}
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
        run: |
          set -Eeuo pipefail
          ssh_base="${ECS_USER}@${ECS_HOST}"
          diagnostic_argument="${DIAGNOSTIC_REQUEST_ID:-_}"
          retry_run_argument="$RETRY_RUN_ID"
          if [ "$MODE" = retry-embedding-job ]; then
            retry_run_argument="${RETRY_RUN_ID:-_}"
          fi
          ssh -i "$HOME/.ssh/openvac" -o BatchMode=yes "$ssh_base" \
            sh -s -- /opt/openvac "$EXPECTED_RELEASE_SHA" "$MODE" "$diagnostic_argument" \
            "$RETRY_DOCUMENT_ID" "$RETRY_VERSION_ID" "$retry_run_argument" "$RETRY_CONTENT_HASH" \
            <deploy/run-knowledge-review-operation.sh \
            | tee "$RUNNER_TEMP/knowledge-review-operation.json"
          {
            echo "### Knowledge review operation"
            echo
            printf -- '- Mode: `%s`\n' "$MODE"
            printf -- '- Expected production release: `%s`\n' "$EXPECTED_RELEASE_SHA"
            echo '- Result: completed without bypassing production environment protection.'
          } >>"$GITHUB_STEP_SUMMARY"
