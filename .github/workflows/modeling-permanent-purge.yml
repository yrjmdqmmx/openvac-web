name: Legacy modeling permanent purge

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment environment and host to inventory or purge
        required: true
        type: choice
        options:
          - staging
          - production
      operation:
        description: Read-only inventory or irreversible purge
        required: true
        type: choice
        options:
          - inventory
          - prepare-ossutil
          - purge
      inventory_phase:
        description: Inventory evidence phase; purge requires post-migration
        required: true
        type: choice
        options:
          - pre-migration
          - post-migration
      expected_inventory_sha256:
        description: Required for purge; copy from the reviewed inventory artifact
        required: false
        default: ""
        type: string
      pre_migration_inventory_run_id:
        description: Required for purge; successful pre-migration inventory workflow run ID
        required: false
        default: ""
        type: string
      pre_migration_inventory_run_attempt:
        description: Required for purge; pre-migration inventory workflow run attempt
        required: false
        default: ""
        type: string
      r1_commit_sha:
        description: Last permitted pre-purge release SHA
        required: true
        type: string
      r2_commit_sha:
        description: Deployed R2 release SHA containing migration 0009
        required: true
        type: string
      deployment_image_digest:
        description: Required after migration; exact staging-proven production image digest (sha256:...)
        required: false
        default: ""
        type: string

concurrency:
  group: openvac-modeling-permanent-purge
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: ${{ inputs.target }}
      url: ${{ inputs.target == 'production' && 'https://openvac.cn/semacad' || 'https://staging-openvac.openvac.cn/semacad' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.r2_commit_sha }}
          persist-credentials: false
      - name: Validate immutable operation inputs
        env:
          OPERATION: ${{ inputs.operation }}
          TARGET: ${{ inputs.target }}
          INVENTORY_PHASE: ${{ inputs.inventory_phase }}
          EXPECTED_INVENTORY_SHA256: ${{ inputs.expected_inventory_sha256 }}
          PRE_MIGRATION_INVENTORY_RUN_ID: ${{ inputs.pre_migration_inventory_run_id }}
          PRE_MIGRATION_INVENTORY_RUN_ATTEMPT: ${{ inputs.pre_migration_inventory_run_attempt }}
          R1_COMMIT_SHA: ${{ inputs.r1_commit_sha }}
          R2_COMMIT_SHA: ${{ inputs.r2_commit_sha }}
          DEPLOYMENT_IMAGE_DIGEST: ${{ inputs.deployment_image_digest }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -Eeuo pipefail
          case "$TARGET" in production|staging) ;; *) exit 64 ;; esac
          case "$OPERATION" in inventory|prepare-ossutil|purge) ;; *) exit 64 ;; esac
          case "$INVENTORY_PHASE" in pre-migration|post-migration) ;; *) exit 64 ;; esac
          [[ "$R1_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$R2_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$R1_COMMIT_SHA" != "$R2_COMMIT_SHA"
          if [ "$OPERATION" = inventory ] || [ "$OPERATION" = prepare-ossutil ]; then
            test -z "$EXPECTED_INVENTORY_SHA256"
            test -z "$PRE_MIGRATION_INVENTORY_RUN_ID"
            test -z "$PRE_MIGRATION_INVENTORY_RUN_ATTEMPT"
            if [ "$OPERATION" = prepare-ossutil ]; then
              test "$INVENTORY_PHASE" = pre-migration
              test -z "$DEPLOYMENT_IMAGE_DIGEST"
              test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
              test "$R2_COMMIT_SHA" = "$GITHUB_SHA"
            elif [ "$INVENTORY_PHASE" = pre-migration ]; then
              test -z "$DEPLOYMENT_IMAGE_DIGEST"
            else
              [[ "$DEPLOYMENT_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            fi
          else
            test "$INVENTORY_PHASE" = post-migration
            [[ "$EXPECTED_INVENTORY_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$PRE_MIGRATION_INVENTORY_RUN_ID" =~ ^[0-9]+$ ]]
            [[ "$PRE_MIGRATION_INVENTORY_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
            [[ "$DEPLOYMENT_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          fi
      - if: inputs.operation == 'purge'
        name: Download the reviewed pre-migration inventory artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: modeling-${{ inputs.target }}-inventory-pre-migration-${{ inputs.pre_migration_inventory_run_id }}-${{ inputs.pre_migration_inventory_run_attempt }}
          path: ${{ runner.temp }}/pre-migration-inventory
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.pre_migration_inventory_run_id }}
      - if: inputs.operation == 'purge'
        name: Validate pre-migration inventory provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRE_RUN_ID: ${{ inputs.pre_migration_inventory_run_id }}
          PRE_RUN_ATTEMPT: ${{ inputs.pre_migration_inventory_run_attempt }}
          R1_COMMIT_SHA: ${{ inputs.r1_commit_sha }}
          R2_COMMIT_SHA: ${{ inputs.r2_commit_sha }}
          TARGET: ${{ inputs.target }}
        run: |
          set -Eeuo pipefail
          artifact="$RUNNER_TEMP/pre-migration-inventory/modeling-operation-result.json"
          test -f "$artifact" && test ! -L "$artifact"
          python3 -m json.tool "$artifact" >/dev/null
          jq -e --arg r1 "$R1_COMMIT_SHA" --arg r2 "$R2_COMMIT_SHA" --arg target "$TARGET" '
            .schema == "modeling-purge-inventory-v1" and
            .target == $target and
            (.host_scope == "shared" or .host_scope == "dedicated") and
            .phase == "pre-migration" and
            .release_evidence.r1_sha == $r1 and
            .release_evidence.r2_sha == $r2 and
            .release_evidence.deployment_image_digest == "" and
            (if $target == "production" then
              .release_evidence.rollback_rehearsal == "passed"
            else
              (.release_evidence.rollback_rehearsal == "passed" or
               .release_evidence.rollback_rehearsal == "not-required")
            end) and
            .oss_bucket_versioning == "unversioned" and
            (.inventory_sha256 | test("^[0-9a-f]{64}$")) and
            (.database.modeling_tables | type == "number") and
            (.database.modeling_enums | type == "number") and
            (.database.modeling_cards | type == "number")
          ' "$artifact" >/dev/null
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRE_RUN_ID/attempts/$PRE_RUN_ATTEMPT")"
          jq -e --arg sha "$R2_COMMIT_SHA" '
            .path == ".github/workflows/modeling-permanent-purge.yml" and
            .event == "workflow_dispatch" and
            .conclusion == "success" and
            .head_sha == $sha
          ' <<<"$run_json" >/dev/null
      - name: Configure SSH
        env:
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ECS_SSH_KEY" >"$HOME/.ssh/openvac"
          chmod 600 "$HOME/.ssh/openvac"
          printf '%s\n' "$ECS_KNOWN_HOSTS" >"$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Run approved operation on the exact environment host
        env:
          OPERATION: ${{ inputs.operation }}
          TARGET: ${{ inputs.target }}
          INVENTORY_PHASE: ${{ inputs.inventory_phase }}
          EXPECTED_INVENTORY_SHA256: ${{ inputs.expected_inventory_sha256 }}
          R1_COMMIT_SHA: ${{ inputs.r1_commit_sha }}
          R2_COMMIT_SHA: ${{ inputs.r2_commit_sha }}
          DEPLOYMENT_IMAGE_DIGEST: ${{ inputs.deployment_image_digest }}
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
        run: |
          set -Eeuo pipefail
          ssh_base="${ECS_USER}@${ECS_HOST}"
          remote_stage="/tmp/openvac-modeling-purge-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          result="$RUNNER_TEMP/modeling-${TARGET}-${OPERATION}-result.json"
          digest_argument="${DEPLOYMENT_IMAGE_DIGEST:--}"
          cleanup() {
            ssh -i "$HOME/.ssh/openvac" -o BatchMode=yes "$ssh_base" \
              "case '$remote_stage' in /tmp/openvac-modeling-purge-*) rm -rf -- '$remote_stage' ;; esac" \
              >/dev/null 2>&1 || true
          }
          trap cleanup EXIT HUP INT TERM
          ssh -i "$HOME/.ssh/openvac" -o BatchMode=yes "$ssh_base" \
            "install -d -m 700 '$remote_stage'"
          scp -i "$HOME/.ssh/openvac" -o BatchMode=yes \
            deploy/modeling-purge-inventory.sh \
            deploy/modeling-purge-execute.sh \
            deploy/install-pinned-ossutil.sh \
            deploy/backup.sh \
            deploy/upload-backup-oss.sh \
            deploy/restore-drill.sh \
            deploy/verify-clean-restore.sh \
            "$ssh_base:$remote_stage/"
          if [ "$OPERATION" = purge ]; then
            scp -i "$HOME/.ssh/openvac" -o BatchMode=yes \
              "$RUNNER_TEMP/pre-migration-inventory/modeling-operation-result.json" \
              "$ssh_base:$remote_stage/pre-migration-inventory.json"
          fi

          if [ "$OPERATION" = inventory ]; then
            ssh -i "$HOME/.ssh/openvac" -o BatchMode=yes "$ssh_base" \
              sh -s -- "$remote_stage" "$TARGET" "$INVENTORY_PHASE" "$R1_COMMIT_SHA" \
              "$R2_COMMIT_SHA" "$digest_argument" \
              >"$result" <<'REMOTE_INVENTORY'
          set -eu
          remote_stage="$1"
          target="$2"
          inventory_phase="$3"
          r1_sha="$4"
          r2_sha="$5"
          deployment_image_digest="$6"
          [ "$deployment_image_digest" != "-" ] || deployment_image_digest=""
          case "$remote_stage" in /tmp/openvac-modeling-purge-*) ;; *) exit 64 ;; esac
          if [ "$(id -u)" -eq 0 ]; then
            exec bash "$remote_stage/modeling-purge-inventory.sh" "$target" "" \
              "$inventory_phase" "$r1_sha" "$r2_sha" "$deployment_image_digest"
          fi
          exec sudo -n bash "$remote_stage/modeling-purge-inventory.sh" "$target" "" \
            "$inventory_phase" "$r1_sha" "$r2_sha" "$deployment_image_digest"
          REMOTE_INVENTORY
          elif [ "$OPERATION" = prepare-ossutil ]; then
            ssh -i "$HOME/.ssh/openvac" -o BatchMode=yes "$ssh_base" \
              sh -s -- "$remote_stage" "$TARGET" >"$result" <<'REMOTE_PREPARE'
          set -eu
          remote_stage="$1"
          target="$2"
          case "$remote_stage" in /tmp/openvac-modeling-purge-*) ;; *) exit 64 ;; esac
          if [ "$(id -u)" -eq 0 ]; then
            exec bash "$remote_stage/install-pinned-ossutil.sh" "$target"
          fi
          exec sudo -n bash "$remote_stage/install-pinned-ossutil.sh" "$target"
          REMOTE_PREPARE
          else
            ssh -i "$HOME/.ssh/openvac" -o BatchMode=yes "$ssh_base" \
              sh -s -- "$remote_stage" "$TARGET" "$EXPECTED_INVENTORY_SHA256" \
              "$R1_COMMIT_SHA" "$R2_COMMIT_SHA" "$DEPLOYMENT_IMAGE_DIGEST" \
              >"$result" <<'REMOTE_PURGE'
          set -eu
          remote_stage="$1"
          target="$2"
          expected_inventory_sha256="$3"
          r1_sha="$4"
          r2_sha="$5"
          deployment_image_digest="$6"
          case "$remote_stage" in /tmp/openvac-modeling-purge-*) ;; *) exit 64 ;; esac
          if [ "$(id -u)" -eq 0 ]; then
            exec bash "$remote_stage/modeling-purge-execute.sh" "$target" \
              "$expected_inventory_sha256" "$remote_stage/pre-migration-inventory.json" \
              "$r1_sha" "$r2_sha" "$deployment_image_digest"
          fi
          exec sudo -n bash "$remote_stage/modeling-purge-execute.sh" "$target" \
            "$expected_inventory_sha256" "$remote_stage/pre-migration-inventory.json" \
            "$r1_sha" "$r2_sha" "$deployment_image_digest"
          REMOTE_PURGE
          fi
          python3 -m json.tool "$result" >/dev/null
          cp "$result" "$RUNNER_TEMP/modeling-operation-result.json"
          {
            echo "### Legacy modeling $OPERATION"
            echo
            echo '```json'
            cat "$result"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          trap - EXIT HUP INT TERM
          cleanup
      - name: Save deletion-safe inventory or receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: modeling-${{ inputs.target }}-${{ inputs.operation }}-${{ inputs.inventory_phase }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/modeling-operation-result.json
          if-no-files-found: error
          retention-days: 30
