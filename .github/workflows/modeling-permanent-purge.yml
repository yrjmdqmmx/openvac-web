name: Legacy modeling permanent purge

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only inventory or irreversible purge
        required: true
        type: choice
        options:
          - inventory
          - purge
      expected_inventory_sha256:
        description: Required for purge; copy from the reviewed inventory artifact
        required: false
        default: ""
        type: string
      pre_migration_inventory_sha256:
        description: Required for purge; reviewed inventory captured before R2 migration
        required: false
        default: ""
        type: string
      pre_migration_database_tables:
        description: Required for purge; pre-R2 modeling table count
        required: false
        default: ""
        type: string
      pre_migration_database_enums:
        description: Required for purge; pre-R2 modeling enum count
        required: false
        default: ""
        type: string
      pre_migration_database_cards:
        description: Required for purge; pre-R2 message modelingCards count
        required: false
        default: ""
        type: string
      r1_commit_sha:
        description: Last permitted pre-purge release SHA
        required: true
        type: string
      r2_commit_sha:
        description: Deployed R2 release SHA containing migration 0009
        required: true
        type: string
      deployment_image_digest:
        description: Exact staging-proven production image digest (sha256:...)
        required: true
        type: string

concurrency:
  group: openvac-modeling-permanent-purge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://openvac.cn/semacad
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.r2_commit_sha }}
          persist-credentials: false
      - name: Validate immutable operation inputs
        env:
          OPERATION: ${{ inputs.operation }}
          EXPECTED_INVENTORY_SHA256: ${{ inputs.expected_inventory_sha256 }}
          PRE_MIGRATION_INVENTORY_SHA256: ${{ inputs.pre_migration_inventory_sha256 }}
          PRE_MIGRATION_DATABASE_TABLES: ${{ inputs.pre_migration_database_tables }}
          PRE_MIGRATION_DATABASE_ENUMS: ${{ inputs.pre_migration_database_enums }}
          PRE_MIGRATION_DATABASE_CARDS: ${{ inputs.pre_migration_database_cards }}
          R1_COMMIT_SHA: ${{ inputs.r1_commit_sha }}
          R2_COMMIT_SHA: ${{ inputs.r2_commit_sha }}
          DEPLOYMENT_IMAGE_DIGEST: ${{ inputs.deployment_image_digest }}
        run: |
          set -Eeuo pipefail
          case "$OPERATION" in inventory|purge) ;; *) exit 64 ;; esac
          [[ "$R1_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$R2_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$R1_COMMIT_SHA" != "$R2_COMMIT_SHA"
          [[ "$DEPLOYMENT_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          if [ "$OPERATION" = inventory ]; then
            test -z "$EXPECTED_INVENTORY_SHA256"
          else
            [[ "$EXPECTED_INVENTORY_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$PRE_MIGRATION_INVENTORY_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$PRE_MIGRATION_DATABASE_TABLES" =~ ^[0-9]+$ ]]
            [[ "$PRE_MIGRATION_DATABASE_ENUMS" =~ ^[0-9]+$ ]]
            [[ "$PRE_MIGRATION_DATABASE_CARDS" =~ ^[0-9]+$ ]]
          fi
      - name: Configure SSH
        env:
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ECS_SSH_KEY" >"$HOME/.ssh/openvac"
          chmod 600 "$HOME/.ssh/openvac"
          printf '%s\n' "$ECS_KNOWN_HOSTS" >"$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Run approved operation on the exact production host
        env:
          OPERATION: ${{ inputs.operation }}
          EXPECTED_INVENTORY_SHA256: ${{ inputs.expected_inventory_sha256 }}
          PRE_MIGRATION_INVENTORY_SHA256: ${{ inputs.pre_migration_inventory_sha256 }}
          PRE_MIGRATION_DATABASE_TABLES: ${{ inputs.pre_migration_database_tables }}
          PRE_MIGRATION_DATABASE_ENUMS: ${{ inputs.pre_migration_database_enums }}
          PRE_MIGRATION_DATABASE_CARDS: ${{ inputs.pre_migration_database_cards }}
          R1_COMMIT_SHA: ${{ inputs.r1_commit_sha }}
          R2_COMMIT_SHA: ${{ inputs.r2_commit_sha }}
          DEPLOYMENT_IMAGE_DIGEST: ${{ inputs.deployment_image_digest }}
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
        run: |
          set -Eeuo pipefail
          ssh_base="${ECS_USER}@${ECS_HOST}"
          remote_stage="/tmp/openvac-modeling-purge-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          result="$RUNNER_TEMP/modeling-${OPERATION}-result.json"
          cleanup() {
            ssh -i "$HOME/.ssh/openvac" -o BatchMode=yes "$ssh_base" \
              "case '$remote_stage' in /tmp/openvac-modeling-purge-*) rm -rf -- '$remote_stage' ;; esac" \
              >/dev/null 2>&1 || true
          }
          trap cleanup EXIT HUP INT TERM
          ssh -i "$HOME/.ssh/openvac" -o BatchMode=yes "$ssh_base" \
            "install -d -m 700 '$remote_stage'"
          scp -i "$HOME/.ssh/openvac" -o BatchMode=yes \
            deploy/modeling-purge-inventory.sh \
            deploy/modeling-purge-execute.sh \
            deploy/backup.sh \
            deploy/upload-backup-oss.sh \
            deploy/restore-drill.sh \
            deploy/verify-clean-restore.sh \
            "$ssh_base:$remote_stage/"

          if [ "$OPERATION" = inventory ]; then
            ssh -i "$HOME/.ssh/openvac" -o BatchMode=yes "$ssh_base" \
              sh -s -- "$remote_stage" >"$result" <<'REMOTE_INVENTORY'
          set -eu
          remote_stage="$1"
          case "$remote_stage" in /tmp/openvac-modeling-purge-*) ;; *) exit 64 ;; esac
          if [ "$(id -u)" -eq 0 ]; then
            exec bash "$remote_stage/modeling-purge-inventory.sh" production
          fi
          exec sudo -n bash "$remote_stage/modeling-purge-inventory.sh" production
          REMOTE_INVENTORY
          else
            ssh -i "$HOME/.ssh/openvac" -o BatchMode=yes "$ssh_base" \
              sh -s -- "$remote_stage" "$EXPECTED_INVENTORY_SHA256" \
              "$PRE_MIGRATION_INVENTORY_SHA256" \
              "$PRE_MIGRATION_DATABASE_TABLES" "$PRE_MIGRATION_DATABASE_ENUMS" \
              "$PRE_MIGRATION_DATABASE_CARDS" "$R1_COMMIT_SHA" "$R2_COMMIT_SHA" \
              "$DEPLOYMENT_IMAGE_DIGEST" \
              >"$result" <<'REMOTE_PURGE'
          set -eu
          remote_stage="$1"
          expected_inventory_sha256="$2"
          pre_migration_inventory_sha256="$3"
          pre_migration_database_tables="$4"
          pre_migration_database_enums="$5"
          pre_migration_database_cards="$6"
          r1_sha="$7"
          r2_sha="$8"
          deployment_image_digest="$9"
          case "$remote_stage" in /tmp/openvac-modeling-purge-*) ;; *) exit 64 ;; esac
          if [ "$(id -u)" -eq 0 ]; then
            exec bash "$remote_stage/modeling-purge-execute.sh" production \
              "$expected_inventory_sha256" "$pre_migration_inventory_sha256" \
              "$pre_migration_database_tables" "$pre_migration_database_enums" \
              "$pre_migration_database_cards" "$r1_sha" "$r2_sha" "$deployment_image_digest"
          fi
          exec sudo -n bash "$remote_stage/modeling-purge-execute.sh" production \
            "$expected_inventory_sha256" "$pre_migration_inventory_sha256" \
            "$pre_migration_database_tables" "$pre_migration_database_enums" \
            "$pre_migration_database_cards" "$r1_sha" "$r2_sha" "$deployment_image_digest"
          REMOTE_PURGE
          fi
          python3 -m json.tool "$result" >/dev/null
          cp "$result" "$RUNNER_TEMP/modeling-operation-result.json"
          {
            echo "### Legacy modeling $OPERATION"
            echo
            echo '```json'
            cat "$result"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          trap - EXIT HUP INT TERM
          cleanup
      - name: Save deletion-safe inventory or receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: modeling-${{ inputs.operation }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/modeling-operation-result.json
          if-no-files-found: error
          retention-days: 30
